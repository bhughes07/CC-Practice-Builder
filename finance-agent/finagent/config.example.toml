# finagent configuration
# Copy to config.toml (`finagent init` does this). config.toml is git-ignored.
# Secrets NEVER go in this file. Save them with `finagent keys` (a private file finagent loads
# automatically) or set them as environment variables:
#   PLAID_CLIENT_ID          Plaid client id         (Plaid Dashboard → Keys)
#   PLAID_SECRET             Plaid Production secret
#   PLAID_SANDBOX_SECRET     Plaid Sandbox secret (used when env = "sandbox")
#   YNAB_TOKEN               YNAB personal access token
#   FINAGENT_SMTP_PASSWORD   email app password
#   ANTHROPIC_API_KEY        only if you turn on the AI coach's note

[household]
name = "Our Household"
currency = "$"
week_starts_on = "monday"          # weekly reports cover Mon–Sun (or "sunday")

[source]
# plaid → connects straight to your banks and cards (run `finagent plaid link` once per bank)
# ynab  → pulls live from the YNAB API (includes your budget targets)
# csv   → reads exports from any app/bank dropped in the imports/ folder
# Combine them with a list, e.g. type = ["plaid", "csv"]
type = "plaid"
budget_id = "last-used"            # YNAB only: "last-used" or a budget id from `finagent ynab-budgets`
history_months = 12                # how far back to pull (12 catches annual renewals)

[csv]
paths = ["imports/*.csv"]
format = "auto"                    # auto | ynab | monarch | mint | rocket | copilot | generic
sign = "auto"                      # auto | expenses_negative | expenses_positive
date_order = "auto"                # auto | mdy | dmy

[storage]
database = "data/finance.db"       # Plaid sandbox (test) mode automatically uses data/sandbox.db

[plaid]
env = "production"                 # "sandbox" = Plaid's fake test bank; override per run with PLAID_ENV
country_codes = ["US"]
days_requested = 730               # history to request when you connect a bank (max 730 days)
port = 8765                        # local page used for `finagent plaid link`
client_name = "finagent"           # shown in the Plaid window

[analysis]
review_months = 6                  # 3–6 is the sweet spot for the review
savings_rate_target = 0.15
min_monthly_impact = 5.0           # hide suggestions worth less than this per month
large_transaction = 150.0          # floor for "unusual purchase" flags
# Never suggested as cuts. Matched (case-insensitive) against "<group> <category>".
protected = ["tithe", "giving", "church", "charity", "donation", "offering", "missions",
             "saving", "invest", "retirement", "401k", "ira", "emergency fund", "529"]

# Which income counts as "regular" — the income your budget is built on. One-time money
# (tax refunds, settlements, gifts, single large deposits) is shown in reports but never counted.
# Your budget spreadsheet's Income tab (Yes/No per source) overrides all of this.
[income]
regular = []                       # if set, ONLY matching deposits count, e.g. ["church payroll"]
one_time = []                      # extra patterns to always treat as one-time, e.g. ["settlement"]

# `finagent sheet` creates this Excel workbook. When it exists, it's where your budgets live.
[budget_sheet]
path = "budget.xlsx"

# Monthly targets, used when your source has no budgets (Plaid, banks, most CSVs).
# YNAB provides its own. Category names must match your data exactly —
# `finagent budget-suggest` prints a ready-to-paste block based on what you really spend.
[budgets]
# "Groceries" = 900
# "Dining Out" = 350
# "Shopping" = 300

[categories]
force_merchant_rules = false       # true = merchant rules override existing categories too
ignore = []                        # categories to drop entirely, e.g. ["Reimbursable"]

[categories.merchant_rules]        # normalized merchant → category (for uncategorized rows)
# "Chick-fil-A" = "Dining Out"
# "Venmo" = "Kids Activities"

[categories.class_overrides]       # category → essential | discretionary | giving | savings | debt | fees | other
# "Kids Activities" = "essential"

[report]
output_dir = "reports"
formats = ["html", "md"]           # add "json" for machine-readable output

[email]
enabled = false                    # `finagent run ...` emails when true; `--email` works any time
smtp_host = "smtp.gmail.com"       # Outlook.com: smtp-mail.outlook.com · Microsoft 365: smtp.office365.com
smtp_port = 587
use_starttls = true
username = ""                      # your email login
from_addr = ""                     # defaults to username
to = []                            # e.g. ["you@example.com", "spouse@example.com"]
subject_prefix = "[Budget]"

[ai]
enabled = false                    # or pass --ai per report
model = "claude-opus-5-5"
effort = "high"
